# Khởi động database:  docker compose up -d
# Biến POSTGRES_* lấy từ backend/.env
services:
  db:
    image: postgres:17-alpine
    container_name: vsmovie-db
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - vsmovie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vsmovie-pgdata:
